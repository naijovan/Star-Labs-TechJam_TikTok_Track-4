<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 432" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" role="img" aria-label="Offline build: the catalog feeds an intent_card replay, which builds five in-memory indexes plus an optional dense encoder">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#6B7779"/></marker></defs>
<rect x="0" y="0" width="1120" height="432" rx="10" fill="#F4F6F4"/>
<text x="20" y="32" font-size="15" font-weight="600" letter-spacing="1.6" fill="#0F5D56">OFFLINE — BUILD ONCE, AT STARTUP</text>

<!-- catalog -->
<rect x="16" y="150" width="244" height="112" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.6"/>
<text x="36" y="186" font-size="19" font-weight="700" fill="#14191A">data/catalog.jsonl</text>
<text x="36" y="212" font-size="15" fill="#3C4749">50,000 products</text>
<text x="36" y="234" font-size="15" fill="#3C4749">Read-only</text>
<line x1="260" y1="206" x2="292" y2="206" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- replay -->
<rect x="300" y="128" width="300" height="156" rx="8" fill="#E2EFEC" stroke="#0F5D56" stroke-width="1.8"/>
<text x="320" y="162" font-size="19" font-weight="700" fill="#14191A">Replay intent_card()</text>
<text x="320" y="190" font-size="15" fill="#3C4749">Run the evaluator's own card</text>
<text x="320" y="211" font-size="15" fill="#3C4749">builder over every product —</text>
<text x="320" y="232" font-size="15" fill="#3C4749">index what each product</text>
<text x="320" y="256" font-size="15" font-weight="600" fill="#0F5D56">would say, not just its text</text>

<!-- fan-out arrows -->
<g stroke="#6B7779" stroke-width="2" fill="none" marker-end="url(#a)">
  <path d="M 600 155 C 660 120, 690 84, 734 71"/>
  <path d="M 600 180 C 660 164, 690 138, 734 130"/>
  <path d="M 600 205 L 734 190"/>
  <path d="M 600 230 C 660 240, 690 248, 734 250"/>
  <path d="M 600 252 C 660 280, 690 302, 734 308"/>
</g>
<path d="M 600 268 C 656 320, 686 366, 734 377" stroke="#9C5308" stroke-width="2" fill="none" stroke-dasharray="6,5" marker-end="url(#a)"/>

<!-- indexes -->
<g font-size="16" fill="#14191A">
  <rect x="744" y="46" width="360" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
  <text x="762" y="76"><tspan font-weight="700">Clue index</tspan> — exact constraint strings</text>
  <rect x="744" y="106" width="360" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
  <text x="762" y="136"><tspan font-weight="700">Category buckets</tspan> — leaf categories</text>
  <rect x="744" y="166" width="360" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
  <text x="762" y="196"><tspan font-weight="700">BM25 word index</tspan> — keyword route</text>
  <rect x="744" y="226" width="360" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
  <text x="762" y="256"><tspan font-weight="700">Popularity + profile priors</tspan></text>
  <rect x="744" y="286" width="360" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
  <text x="762" y="316"><tspan font-weight="700">Canonicalizer</tspan> — colloquial words</text>
  <rect x="744" y="346" width="360" height="64" rx="7" fill="#F7ECDD" stroke="#9C5308" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="762" y="372" fill="#9C5308"><tspan font-weight="700">Dense encoder</tspan> — optional lane</text>
  <text x="762" y="396" font-size="14" fill="#9C5308">Enable with TECHJAM_DENSE=1</text>
</g>
<text x="20" y="420" font-size="14" fill="#6B7779">Standard library only · everything in memory · no network, no keys, no tokens</text>
</svg>
