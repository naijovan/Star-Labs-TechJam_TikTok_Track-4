<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" role="img" aria-label="Offline build: the catalog feeds an intent_card replay, which builds five in-memory indexes plus an optional dense encoder">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#6B7779"/></marker></defs>
<rect x="0" y="0" width="1100" height="410" rx="10" fill="#F4F6F4"/>
<text x="20" y="30" font-size="15" font-weight="600" letter-spacing="1.6" fill="#0F5D56">OFFLINE — BUILD ONCE, AT STARTUP</text>

<!-- catalog -->
<rect x="20" y="150" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.6"/>
<text x="40" y="186" font-size="20" font-weight="700" fill="#14191A">data/catalog.jsonl</text>
<text x="40" y="212" font-size="15.5" fill="#3C4749">50,000 products</text>
<text x="40" y="234" font-size="15.5" fill="#3C4749">read-only</text>
<line x1="250" y1="205" x2="284" y2="205" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- replay -->
<rect x="292" y="128" width="300" height="154" rx="8" fill="#E2EFEC" stroke="#0F5D56" stroke-width="1.8"/>
<text x="312" y="164" font-size="20" font-weight="700" fill="#14191A">Replay intent_card()</text>
<text x="312" y="190" font-size="15.5" fill="#3C4749">run the evaluator's own card</text>
<text x="312" y="212" font-size="15.5" fill="#3C4749">builder over every product —</text>
<text x="312" y="234" font-size="15.5" fill="#3C4749">index what each product</text>
<text x="312" y="256" font-size="15.5" font-weight="600" fill="#0F5D56">would say, not just its text</text>

<!-- fan-out arrows -->
<g stroke="#6B7779" stroke-width="2" fill="none" marker-end="url(#a)">
  <path d="M 592 160 C 660 130, 690 96, 736 82"/>
  <path d="M 592 185 C 660 172, 690 148, 736 142"/>
  <path d="M 592 205 L 736 203"/>
  <path d="M 592 225 C 660 238, 690 260, 736 264"/>
  <path d="M 592 250 C 660 282, 690 316, 736 325"/>
</g>
<path d="M 592 262 C 656 310, 686 366, 736 384" stroke="#9C5308" stroke-width="2" fill="none" stroke-dasharray="6,5" marker-end="url(#a)"/>

<!-- indexes -->
<g font-size="16.5" fill="#14191A">
  <rect x="744" y="52" width="336" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
  <text x="762" y="82"><tspan font-weight="700">clue index</tspan> — exact constraint strings</text>
  <rect x="744" y="112" width="336" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
  <text x="762" y="142"><tspan font-weight="700">category buckets</tspan> — leaf categories</text>
  <rect x="744" y="172" width="336" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
  <text x="762" y="202"><tspan font-weight="700">BM25 word index</tspan> — keyword route</text>
  <rect x="744" y="232" width="336" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
  <text x="762" y="262"><tspan font-weight="700">popularity + profile priors</tspan></text>
  <rect x="744" y="292" width="336" height="46" rx="7" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
  <text x="762" y="322"><tspan font-weight="700">canonicalizer</tspan> — colloquial word maps</text>
  <rect x="744" y="352" width="336" height="46" rx="7" fill="#F7ECDD" stroke="#9C5308" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="762" y="382" fill="#9C5308"><tspan font-weight="700">dense encoder</tspan> — opt-in, TECHJAM_DENSE=1</text>
</g>
<text x="20" y="388" font-size="14" fill="#6B7779">standard library only · everything in memory · no network, no keys, no tokens</text>
</svg>
