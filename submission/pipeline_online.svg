<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1384 436" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" role="img" aria-label="Per-turn flow, left to right: understand the message, remember preferences, shortlist products, order them, choose how many to show, ask one question, answer - and the shopper's reply starts the next turn">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#6B7779"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#0F5D56"/></marker></defs>
<rect x="0" y="0" width="1384" height="436" rx="10" fill="#F4F6F4"/>
<text x="20" y="32" font-size="15" font-weight="600" letter-spacing="1.6" fill="#0F5D56">ONLINE — EVERY TURN</text>

<path d="M 1286 96 L 1286 62 L 98 62 L 98 88" stroke="#0F5D56" stroke-width="2" fill="none" stroke-dasharray="7,5" marker-end="url(#b)"/>
<text x="692" y="54" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0F5D56">The shopper's reply starts the next turn — up to 10 turns</text>

<!-- 1 -->
<rect x="12" y="96" width="172" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="26" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">1 · PARSE</text>
<text x="26" y="150" font-size="21" font-weight="700" fill="#14191A">Understand</text>
<text x="26" y="206" font-size="14.5" fill="#3C4749">• Reads the</text>
<text x="36" y="227" font-size="14.5" fill="#3C4749">shopper's message</text>
<text x="26" y="254" font-size="14.5" fill="#3C4749">• Works out what</text>
<text x="36" y="275" font-size="14.5" fill="#3C4749">they want</text>
<text x="26" y="302" font-size="14.5" fill="#3C4749">• Notices when they</text>
<text x="36" y="323" font-size="14.5" fill="#3C4749">change their mind</text>
<line x1="186" y1="254" x2="200" y2="254" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- 2 -->
<rect x="210" y="96" width="172" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="224" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">2 · REMEMBER</text>
<text x="224" y="150" font-size="21" font-weight="700" fill="#14191A">Remember</text>
<text x="224" y="206" font-size="14.5" fill="#3C4749">• Keeps every</text>
<text x="234" y="227" font-size="14.5" fill="#3C4749">preference heard</text>
<text x="234" y="248" font-size="14.5" fill="#3C4749">so far</text>
<text x="224" y="275" font-size="14.5" fill="#3C4749">• Drops one only</text>
<text x="234" y="296" font-size="14.5" fill="#3C4749">if it's proven</text>
<text x="234" y="317" font-size="14.5" fill="#3C4749">impossible</text>
<line x1="384" y1="254" x2="398" y2="254" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- 3 -->
<rect x="408" y="96" width="172" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="422" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">3 · NARROW</text>
<text x="422" y="150" font-size="21" font-weight="700" fill="#14191A">Shortlist</text>
<text x="422" y="206" font-size="14.5" fill="#3C4749">• Filters to the</text>
<text x="432" y="227" font-size="14.5" fill="#3C4749">right product type</text>
<text x="422" y="254" font-size="14.5" fill="#3C4749">• Keeps items that</text>
<text x="432" y="275" font-size="14.5" fill="#3C4749">match every</text>
<text x="432" y="296" font-size="14.5" fill="#3C4749">preference</text>
<text x="422" y="323" font-size="14.5" fill="#3C4749">• If words differ,</text>
<text x="432" y="344" font-size="14.5" fill="#3C4749">smarter lookups</text>
<text x="422" y="371" font-size="14.5" fill="#3C4749">• Last resort: most</text>
<text x="432" y="392" font-size="14.5" fill="#3C4749">popular items</text>
<line x1="582" y1="254" x2="596" y2="254" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- 4 -->
<rect x="606" y="96" width="172" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="620" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">4 · RANK</text>
<text x="620" y="150" font-size="21" font-weight="700" fill="#14191A">Order</text>
<text x="620" y="206" font-size="14.5" fill="#3C4749">• Best matches first</text>
<text x="620" y="233" font-size="14.5" fill="#3C4749">• Popularity and</text>
<text x="630" y="254" font-size="14.5" fill="#3C4749">personal taste</text>
<text x="630" y="275" font-size="14.5" fill="#3C4749">break ties</text>
<line x1="780" y1="254" x2="794" y2="254" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- 5 -->
<rect x="804" y="96" width="172" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="818" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">5 · SCHEDULE</text>
<text x="818" y="150" font-size="21" font-weight="700" fill="#14191A">Choose how</text>
<text x="818" y="173" font-size="21" font-weight="700" fill="#14191A">many to show</text>
<text x="818" y="206" font-size="14.5" fill="#3C4749">• Confident? Show</text>
<text x="828" y="227" font-size="14.5" fill="#3C4749">the top pick</text>
<text x="818" y="254" font-size="14.5" fill="#3C4749">• Unsure? Hold the</text>
<text x="828" y="275" font-size="14.5" fill="#3C4749">best for next turn</text>
<text x="818" y="302" font-size="14.5" fill="#3C4749">• New items each</text>
<text x="828" y="323" font-size="14.5" fill="#3C4749">turn, no repeats</text>
<line x1="978" y1="254" x2="992" y2="254" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- 6 -->
<rect x="1002" y="96" width="172" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="1016" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">6 · ASK</text>
<text x="1016" y="150" font-size="21" font-weight="700" fill="#14191A">Ask one</text>
<text x="1016" y="173" font-size="21" font-weight="700" fill="#14191A">question</text>
<text x="1016" y="206" font-size="14.5" fill="#3C4749">• One short</text>
<text x="1026" y="227" font-size="14.5" fill="#3C4749">question per turn</text>
<text x="1016" y="254" font-size="14.5" fill="#3C4749">• Stops asking</text>
<text x="1026" y="275" font-size="14.5" fill="#3C4749">when the shopper</text>
<text x="1026" y="296" font-size="14.5" fill="#3C4749">is done</text>
<line x1="1176" y1="254" x2="1190" y2="254" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- 7 -->
<rect x="1200" y="96" width="172" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="1214" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">7 · REPLY</text>
<text x="1214" y="150" font-size="21" font-weight="700" fill="#14191A">Answer</text>
<text x="1214" y="206" font-size="14.5" fill="#3C4749">• Up to 10 products</text>
<text x="1224" y="227" font-size="14.5" fill="#3C4749">plus the question</text>
<text x="1214" y="254" font-size="14.5" fill="#3C4749">• If a step fails,</text>
<text x="1224" y="275" font-size="14.5" fill="#3C4749">reuse the last</text>
<text x="1224" y="296" font-size="14.5" fill="#3C4749">good list</text>
</svg>
