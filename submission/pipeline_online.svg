<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1432 452" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" role="img" aria-label="Per-turn flow, left to right: parse, remember, narrow through a seven-route cascade, rank, schedule, ask, reply — and the customer's reply loops back to parse">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#6B7779"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#0F5D56"/></marker></defs>
<rect x="0" y="0" width="1432" height="452" rx="10" fill="#F4F6F4"/>
<text x="20" y="32" font-size="15" font-weight="600" letter-spacing="1.6" fill="#0F5D56">ONLINE — EVERY TURN</text>

<!-- loop back: reply -> parse -->
<path d="M 1336 96 L 1336 62 L 96 62 L 96 88" stroke="#0F5D56" stroke-width="2" fill="none" stroke-dasharray="7,5" marker-end="url(#b)"/>
<text x="716" y="54" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0F5D56">the customer's reply starts the next turn — up to 10 turns</text>

<!-- 1 PARSE -->
<rect x="12" y="96" width="168" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="26" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">1 · PARSE</text>
<text x="26" y="150" font-size="21" font-weight="700" fill="#14191A">Route the</text>
<text x="26" y="173" font-size="21" font-weight="700" fill="#14191A">intent</text>
<text x="26" y="206" font-size="15" fill="#3C4749">8 template shapes:</text>
<text x="26" y="227" font-size="15" fill="#3C4749">buying, browsing,</text>
<text x="26" y="248" font-size="15" fill="#3C4749">override, boundary</text>
<text x="26" y="280" font-size="15" fill="#3C4749">fuzzy category fix</text>
<text x="26" y="301" font-size="15" fill="#3C4749">counts as a guess</text>
<text x="26" y="333" font-size="15" fill="#9C5308">an override demotes</text>
<text x="26" y="354" font-size="15" fill="#9C5308">the category</text>
<line x1="180" y1="254" x2="198" y2="254" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- 2 REMEMBER -->
<rect x="206" y="96" width="168" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="220" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">2 · REMEMBER</text>
<text x="220" y="150" font-size="21" font-weight="700" fill="#14191A">Keep the</text>
<text x="220" y="173" font-size="21" font-weight="700" fill="#14191A">slots</text>
<text x="220" y="206" font-size="15" fill="#3C4749">clues accumulate;</text>
<text x="220" y="227" font-size="15" fill="#3C4749">filler filtered out</text>
<text x="220" y="259" font-size="15" fill="#3C4749">old slots stay true</text>
<text x="220" y="280" font-size="15" fill="#3C4749">of the target</text>
<text x="220" y="312" font-size="15" fill="#9C5308">erase a slot only on</text>
<text x="220" y="333" font-size="15" fill="#9C5308">catalog-wide proof</text>
<text x="220" y="354" font-size="15" fill="#9C5308">of contradiction</text>
<line x1="374" y1="254" x2="392" y2="254" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- 3 NARROW -->
<rect x="400" y="96" width="270" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="414" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">3 · NARROW</text>
<text x="414" y="150" font-size="21" font-weight="700" fill="#14191A">Retrieval cascade</text>
<text x="414" y="171" font-size="13.5" fill="#6B7779">top to bottom — first decisive route wins</text>
<rect x="414" y="182" width="242" height="28" rx="5" fill="#FAFBFA" stroke="#D7DDDA"/>
<text x="424" y="201" font-size="15" fill="#3C4749"><tspan font-weight="700" fill="#14191A">R1</tspan>  category bucket</text>
<rect x="414" y="214" width="242" height="28" rx="5" fill="#FAFBFA" stroke="#D7DDDA"/>
<text x="424" y="233" font-size="15" fill="#3C4749"><tspan font-weight="700" fill="#14191A">R2</tspan>  exact clue intersection</text>
<rect x="414" y="246" width="242" height="28" rx="5" fill="#FAFBFA" stroke="#D7DDDA"/>
<text x="424" y="265" font-size="15" fill="#3C4749"><tspan font-weight="700" fill="#14191A">R2b</tspan> no-category ∩ <tspan fill="#9C5308" font-size="12.5">if guessed</tspan></text>
<rect x="414" y="278" width="242" height="44" rx="5" fill="#FAFBFA" stroke="#9C5308"/>
<text x="424" y="295" font-size="15" fill="#3C4749">unresolved lane <tspan fill="#9C5308" font-size="12.5">if no clue resolves</tspan></text>
<text x="424" y="314" font-size="13.5" fill="#6B7779">canonicalize → trust BM25 → dense</text>
<rect x="414" y="326" width="242" height="28" rx="5" fill="#FAFBFA" stroke="#D7DDDA"/>
<text x="424" y="345" font-size="15" fill="#3C4749"><tspan font-weight="700" fill="#14191A">R3</tspan>  BM25 keyword</text>
<rect x="414" y="358" width="242" height="28" rx="5" fill="#FAFBFA" stroke="#D7DDDA"/>
<text x="424" y="377" font-size="15" fill="#3C4749"><tspan font-weight="700" fill="#14191A">R4</tspan>  widen <tspan fill="#9C5308" font-size="12.5">if guessed</tspan>  · <tspan font-weight="700" fill="#14191A">R5</tspan> floor</text>
<line x1="670" y1="254" x2="688" y2="254" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- 4 RANK -->
<rect x="696" y="96" width="168" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="710" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">4 · RANK</text>
<text x="710" y="150" font-size="21" font-weight="700" fill="#14191A">Local</text>
<text x="710" y="173" font-size="21" font-weight="700" fill="#14191A">scoring</text>
<text x="710" y="206" font-size="15" fill="#3C4749">popularity prior</text>
<text x="710" y="227" font-size="15" fill="#3C4749">blended with the</text>
<text x="710" y="248" font-size="15" fill="#3C4749">user-profile affinity</text>
<text x="710" y="280" font-size="15" fill="#3C4749">deterministic</text>
<text x="710" y="301" font-size="15" fill="#3C4749">parent_asin</text>
<text x="710" y="322" font-size="15" fill="#3C4749">tie-break</text>
<line x1="864" y1="254" x2="882" y2="254" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- 5 SCHEDULE -->
<rect x="890" y="96" width="168" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="904" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">5 · SCHEDULE</text>
<text x="904" y="150" font-size="21" font-weight="700" fill="#14191A">Slot-value</text>
<text x="904" y="173" font-size="21" font-weight="700" fill="#14191A">paging</text>
<text x="904" y="206" font-size="15" fill="#3C4749">how many cards to</text>
<text x="904" y="227" font-size="15" fill="#3C4749">show now vs hold</text>
<text x="904" y="248" font-size="15" fill="#3C4749">for a better slot</text>
<text x="904" y="280" font-size="15" fill="#3C4749">low-evidence turns</text>
<text x="904" y="301" font-size="15" fill="#3C4749">show one card;</text>
<text x="904" y="322" font-size="15" fill="#3C4749">pages deeper later</text>
<line x1="1058" y1="254" x2="1076" y2="254" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- 6 ASK -->
<rect x="1084" y="96" width="168" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="1098" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">6 · ASK</text>
<text x="1098" y="150" font-size="21" font-weight="700" fill="#14191A">Clarify,</text>
<text x="1098" y="173" font-size="21" font-weight="700" fill="#14191A">always</text>
<text x="1098" y="206" font-size="15" fill="#3C4749">one structured</text>
<text x="1098" y="227" font-size="15" fill="#3C4749">attribute question</text>
<text x="1098" y="248" font-size="15" fill="#3C4749">per turn</text>
<text x="1098" y="280" font-size="15" fill="#3C4749">acknowledges, then</text>
<text x="1098" y="301" font-size="15" fill="#3C4749">thanks and stops</text>
<text x="1098" y="322" font-size="15" fill="#3C4749">when drained</text>
<line x1="1252" y1="254" x2="1270" y2="254" stroke="#6B7779" stroke-width="2.2" marker-end="url(#a)"/>

<!-- 7 REPLY -->
<rect x="1278" y="96" width="142" height="316" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="1292" y="122" font-size="12.5" font-weight="600" fill="#0F5D56">7 · REPLY</text>
<text x="1292" y="150" font-size="21" font-weight="700" fill="#14191A">Fail-safe</text>
<text x="1292" y="173" font-size="21" font-weight="700" fill="#14191A">out</text>
<text x="1292" y="206" font-size="15" fill="#3C4749">10 product IDs</text>
<text x="1292" y="227" font-size="15" fill="#3C4749">+ 1 question</text>
<text x="1292" y="259" font-size="15" fill="#3C4749">any fault falls</text>
<text x="1292" y="280" font-size="15" fill="#3C4749">back to the last</text>
<text x="1292" y="301" font-size="15" fill="#3C4749">good page —</text>
<text x="1292" y="322" font-size="15" fill="#3C4749">never raises</text>
<text x="20" y="440" font-size="14" fill="#6B7779">amber notes are evidence gates: the expensive route runs only when the cheap one has provably failed</text>
</svg>
