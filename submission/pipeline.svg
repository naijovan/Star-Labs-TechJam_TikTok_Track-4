<!-- 3 NARROW -->
<rect x="556" y="28" width="252" height="370" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/>
<text x="570" y="52" font-size="12" font-weight="600" fill="#0F5D56">3 · NARROW</text>
<text x="570" y="76" font-size="20" font-weight="700" fill="#14191A">Retrieval cascade</text>
<text x="570" y="96" font-size="12.5" fill="#6B7779">top to bottom — first decisive route wins</text>
<rect x="570" y="106" width="224" height="30" rx="5" fill="#FAFBFA" stroke="#D7DDDA"/>
<text x="580" y="126" font-size="14" fill="#3C4749"><tspan font-weight="700" fill="#14191A">R1</tspan>  category bucket</text>
<rect x="570" y="141" width="224" height="30" rx="5" fill="#FAFBFA" stroke="#D7DDDA"/>
<text x="580" y="161" font-size="14" fill="#3C4749"><tspan font-weight="700" fill="#14191A">R2</tspan>  exact clue ∩ (91% unique)</text>
<rect x="570" y="176" width="224" height="30" rx="5" fill="#FAFBFA" stroke="#D7DDDA"/>
<text x="580" y="196" font-size="14" fill="#3C4749"><tspan font-weight="700" fill="#14191A">R2b</tspan> no-category ∩ <tspan fill="#9C5308" font-size="12">gate: guessed</tspan></text>
<rect x="570" y="211" width="224" height="46" rx="5" fill="#FAFBFA" stroke="#9C5308"/>
<text x="580" y="229" font-size="14" fill="#3C4749">unresolved lane <tspan fill="#9C5308" font-size="12">gate: no clue resolves</tspan></text>
<text x="580" y="248" font-size="13" fill="#6B7779">canonicalize → trust BM25 → dense</text>
<rect x="570" y="262" width="224" height="30" rx="5" fill="#FAFBFA" stroke="#D7DDDA"/>
<text x="580" y="282" font-size="14" fill="#3C4749"><tspan font-weight="700" fill="#14191A">R3</tspan>  BM25 keyword</text>
<rect x="570" y="297" width="224" height="30" rx="5" fill="#FAFBFA" stroke="#D7DDDA"/>
<text x="580" y="317" font-size="14" fill="#3C4749"><tspan font-weight="700" fill="#14191A">R4</tspan>  widen <tspan fill="#9C5308" font-size="12">gate: guessed</tspan></text>
<rect x="570" y="332" width="224" height="30" rx="5" fill="#FAFBFA" stroke="#D7DDDA"/>
<text x="580" y="352" font-size="14" fill="#3C4749"><tspan font-weight="700" fill="#14191A">R5</tspan>  popularity × profile floor</text>
<text x="570" y="386" font-size="13.5" font-family="'SF Mono',Consolas,monospace" fill="#0F5D56">clue ∩ removed: −0.209</text>
<line x1="808" y1="212" x2="822" y2="212" stroke="#6B7779" stroke-width="2" marker-end="url(#a)"/>

<!-- 4 RANK -->
<rect x="830" y="28" width="152" height="370" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/>
<text x="844" y="52" font-size="12" font-weight="600" fill="#0F5D56">4 · RANK</text>
<text x="844" y="76" font-size="20" font-weight="700" fill="#14191A">Local</text>
<text x="844" y="98" font-size="20" font-weight="700" fill="#14191A">scoring</text>
<text x="844" y="128" font-size="14" fill="#3C4749">log1p(reviews)</text>
<text x="844" y="146" font-size="14" fill="#3C4749">+ 0.35 × profile</text>
<text x="844" y="164" font-size="14" fill="#3C4749">affinity</text>
<text x="844" y="192" font-size="14" fill="#3C4749">parent_asin</text>
<text x="844" y="210" font-size="14" fill="#3C4749">tie-break =</text>
<text x="844" y="228" font-size="14" fill="#3C4749">deterministic</text>
<line x1="844" y1="360" x2="968" y2="360" stroke="#D7DDDA" stroke-width="1" stroke-dasharray="3,3"/>
<text x="844" y="382" font-size="13.5" font-family="'SF Mono',Consolas,monospace" fill="#0F5D56">beat 9 ML rankers</text>
<line x1="982" y1="212" x2="996" y2="212" stroke="#6B7779" stroke-width="2" marker-end="url(#a)"/>

<!-- 5 SCHEDULE -->
<rect x="1004" y="28" width="152" height="370" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/>
<text x="1018" y="52" font-size="12" font-weight="600" fill="#0F5D56">5 · SCHEDULE</text>
<text x="1018" y="76" font-size="20" font-weight="700" fill="#14191A">Slot-value</text>
<text x="1018" y="98" font-size="20" font-weight="700" fill="#14191A">paging</text>
<text x="1018" y="128" font-size="14" fill="#3C4749">hit(t,r) is worth</text>
<text x="1018" y="146" font-size="14" fill="#3C4749">.50+.30/r+.02(11−t)</text>
<text x="1018" y="174" font-size="14" fill="#3C4749">turn 1 + no-evidence</text>
<text x="1018" y="192" font-size="14" fill="#3C4749">turns show 1 card</text>
<text x="1018" y="220" font-size="14" fill="#3C4749">pages deeper</text>
<text x="1018" y="238" font-size="14" fill="#3C4749">each turn</text>
<line x1="1018" y1="360" x2="1142" y2="360" stroke="#D7DDDA" stroke-width="1" stroke-dasharray="3,3"/>
<text x="1018" y="382" font-size="13.5" font-family="'SF Mono',Consolas,monospace" fill="#0F5D56">clean MRR → 1.0000</text>
<line x1="1156" y1="212" x2="1170" y2="212" stroke="#6B7779" stroke-width="2" marker-end="url(#a)"/>

<!-- 6 ASK -->
<rect x="1178" y="28" width="152" height="370" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/>
