<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 500" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" role="img" aria-label="The agent pipeline, left to right: build the indexes once, then each turn parse, remember, narrow, rank, schedule, ask, reply - ending at TechnicalScore 0.9800">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#6B7779"/></marker></defs>
<rect x="0" y="0" width="1520" height="500" rx="10" fill="#F4F6F4"/>

<text x="16" y="18" font-size="13" font-weight="600" letter-spacing="1.4" fill="#0F5D56">ONCE — OFFLINE · 3.5 s</text>
<text x="208" y="18" font-size="13" font-weight="600" letter-spacing="1.4" fill="#6B7779">EVERY TURN — REPEATS UP TO 10x · 0.06 ms MEDIAN · THE REPLY LOOPS BACK TO PARSE</text>

<!-- 0 BUILD -->
<rect x="14" y="28" width="172" height="370" rx="8" fill="#E2EFEC" stroke="#0F5D56" stroke-width="1.6"/>
<text x="28" y="52" font-size="12" font-weight="600" fill="#0F5D56">0 · BUILD</text>
<text x="28" y="76" font-size="20" font-weight="700" fill="#14191A">Index the</text>
<text x="28" y="98" font-size="20" font-weight="700" fill="#14191A">catalog</text>
<text x="28" y="128" font-size="14" fill="#3C4749">Replay intent_card()</text>
<text x="28" y="146" font-size="14" fill="#3C4749">over 50,000 products</text>
<text x="28" y="172" font-size="14" fill="#3C4749">5 inverted indexes:</text>
<text x="28" y="190" font-size="14" fill="#3C4749">clues · buckets · BM25</text>
<text x="28" y="208" font-size="14" fill="#3C4749">popularity · profile</text>
<text x="28" y="234" font-size="14" fill="#3C4749">160-map canonicalizer</text>
<text x="28" y="260" font-size="14" fill="#9C5308">dense lane: opt-in via</text>
<text x="28" y="278" font-size="14" fill="#9C5308">TECHJAM_DENSE=1</text>
<line x1="28" y1="360" x2="172" y2="360" stroke="#0F5D56" stroke-width="1" stroke-dasharray="3,3"/>
<text x="28" y="382" font-size="13.5" font-family="'SF Mono',Consolas,monospace" fill="#0F5D56">341 MiB · stdlib only</text>
<line x1="186" y1="212" x2="200" y2="212" stroke="#6B7779" stroke-width="2" marker-end="url(#a)"/>

<!-- 1 PARSE -->
<rect x="208" y="28" width="152" height="370" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/>
<text x="222" y="52" font-size="12" font-weight="600" fill="#0F5D56">1 · PARSE</text>
<text x="222" y="76" font-size="20" font-weight="700" fill="#14191A">Route the</text>
<text x="222" y="98" font-size="20" font-weight="700" fill="#14191A">intent</text>
<text x="222" y="128" font-size="14" fill="#3C4749">8 template shapes:</text>
<text x="222" y="146" font-size="14" fill="#3C4749">buying · browsing</text>
<text x="222" y="164" font-size="14" fill="#3C4749">override · boundary</text>
<text x="222" y="192" font-size="14" fill="#3C4749">fuzzy category fix</text>
<text x="222" y="210" font-size="14" fill="#3C4749">= a guess, not fact</text>
<text x="222" y="238" font-size="14" fill="#9C5308">override demotes</text>
<text x="222" y="256" font-size="14" fill="#9C5308">the category</text>
<line x1="222" y1="360" x2="346" y2="360" stroke="#D7DDDA" stroke-width="1" stroke-dasharray="3,3"/>
