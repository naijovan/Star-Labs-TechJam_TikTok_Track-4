<text x="1192" y="76" font-size="20" font-weight="700" fill="#14191A">Clarify,</text>
<text x="1192" y="98" font-size="20" font-weight="700" fill="#14191A">always</text>
<text x="1192" y="128" font-size="14" fill="#3C4749">ask_attribute</text>
<text x="1192" y="146" font-size="14" fill="#3C4749">"other" — drains 2</text>
<text x="1192" y="164" font-size="14" fill="#3C4749">constraints, free</text>
<text x="1192" y="192" font-size="14" fill="#3C4749">acknowledges, then</text>
<text x="1192" y="210" font-size="14" fill="#3C4749">thanks + stops</text>
<text x="1192" y="228" font-size="14" fill="#3C4749">when drained</text>
<line x1="1192" y1="360" x2="1316" y2="360" stroke="#D7DDDA" stroke-width="1" stroke-dasharray="3,3"/>
<text x="1192" y="382" font-size="13.5" font-family="'SF Mono',Consolas,monospace" fill="#0F5D56">300 prompts, 0 repeats</text>
<line x1="1330" y1="212" x2="1344" y2="212" stroke="#6B7779" stroke-width="2" marker-end="url(#a)"/>

<!-- 7 REPLY -->
<rect x="1352" y="28" width="152" height="370" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/>
<text x="1366" y="52" font-size="12" font-weight="600" fill="#0F5D56">7 · REPLY</text>
<text x="1366" y="76" font-size="20" font-weight="700" fill="#14191A">Fail-safe</text>
<text x="1366" y="98" font-size="20" font-weight="700" fill="#14191A">out</text>
<text x="1366" y="128" font-size="14" fill="#3C4749">any fault degrades</text>
<text x="1366" y="146" font-size="14" fill="#3C4749">to the last good</text>
<text x="1366" y="164" font-size="14" fill="#3C4749">page — never raises</text>
<text x="1366" y="192" font-size="14" fill="#3C4749">optional JSONL</text>
<text x="1366" y="210" font-size="14" fill="#3C4749">trace per turn</text>
