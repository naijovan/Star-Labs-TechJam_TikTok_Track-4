<line x1="360" y1="212" x2="374" y2="212" stroke="#6B7779" stroke-width="2" marker-end="url(#a)"/>

<!-- 2 REMEMBER -->
<rect x="382" y="28" width="152" height="370" rx="8" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/>
<text x="396" y="52" font-size="12" font-weight="600" fill="#0F5D56">2 · REMEMBER</text>
<text x="396" y="76" font-size="20" font-weight="700" fill="#14191A">Keep the</text>
<text x="396" y="98" font-size="20" font-weight="700" fill="#14191A">slots</text>
<text x="396" y="128" font-size="14" fill="#3C4749">clues accumulate;</text>
<text x="396" y="146" font-size="14" fill="#3C4749">filler filtered out</text>
<text x="396" y="174" font-size="14" fill="#3C4749">old slots stay true</text>
<text x="396" y="192" font-size="14" fill="#3C4749">of the target</text>
<text x="396" y="220" font-size="14" fill="#9C5308">erase only on</text>
<text x="396" y="238" font-size="14" fill="#9C5308">catalog-wide proof</text>
<line x1="396" y1="360" x2="520" y2="360" stroke="#D7DDDA" stroke-width="1" stroke-dasharray="3,3"/>
